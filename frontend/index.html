<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Biogy — Ressource de cours, travaux pratiques et veille scientifique pour les élèves de STL Biotechnologie.">
    <meta name="theme-color" content="#f2efe7">
    <script>
      // Thème jour/nuit appliqué avant l'affichage pour éviter un flash blanc.
      (function () {
        try {
          var saved = localStorage.getItem('biogy-theme');
          var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (dark) {
            document.documentElement.classList.add('dark');
            document.querySelector('meta[name="theme-color"]').setAttribute('content', '#0e1412');
          }
        } catch (e) {}
      })();
    </script>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <title>Biogy — STL Biotechnologie</title>

    <!-- Font preconnect -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- Newsreader (titres, esprit revue scientifique) + Inter (lecture) + JetBrains Mono (étiquettes de labo) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,300..700;1,6..72,300..600&display=swap" rel="stylesheet">
</head>
<body>
    <div id="root"></div>
    <script type="module" src="/src/index.jsx"></script>
    <noscript>
        <div style="padding: 20px; text-align: center; font-family: sans-serif;">
            <h1>JavaScript est désactivé</h1>
            <p>Biogy nécessite JavaScript pour fonctionner. Veuillez l'activer dans les paramètres de votre navigateur.</p>
        </div>
    </noscript>
</body>
</html>
