name: Biogy checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm test --prefix frontend
      - run: npm run build --prefix frontend
      - run: npm ci --prefix backend
      - run: npm test --prefix backend
      - run: npm audit --omit=dev --audit-level=high --prefix frontend
      - run: npm audit --omit=dev --audit-level=high --prefix backend
      - run: npm ci --prefix netlify/functions
      - run: npm audit --omit=dev --audit-level=high --prefix netlify/functions
