# Optional Render Blueprint. The existing service must point at this file.
services:
  - type: web
    name: biogy
    runtime: node
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        value: https://biogy.netlify.app
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
